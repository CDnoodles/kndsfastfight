<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>30天养成·回合战斗</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
    <!-- 头部 -->
    <div class="header">
        <span>⚔️ 勇者养成</span>
        <span class="day-badge" id="dayDisplay">第 1 天</span>
        <span id="phaseLabel" style="font-size:14px; background:#0f3460; padding:4px 14px; border-radius:40px;">训练</span>
    </div>

    <!-- 玩家属性面板 -->
    <div class="panel" id="playerPanel">
        <div class="flex-between">
            <span style="font-weight:700; font-size:18px;">🧙 勇者</span>
            <span id="hpText" style="font-size:16px;">❤️ 100/100</span>
        </div>
        <div class="hp-mp-bar">
            <div class="bar-container">
                <div class="bar-fill hp" id="hpBar" style="width:100%"></div>
                <span class="bar-label" id="hpLabel">HP</span>
            </div>
            <div class="bar-container">
                <div class="bar-fill mp" id="mpBar" style="width:100%"></div>
                <span class="bar-label" id="mpLabel">MP</span>
            </div>
        </div>
        <div class="progress-container">
            <div class="bar-container">
                <div class="bar-fill progress" id="progressBar" style="width:0%"></div>
                <span class="bar-label" id="progressLabel">⏳ 0%</span>
            </div>
        </div>
        <div class="stat-grid" id="statGrid"></div>
        <div class="action-row" id="actionRow">
            <button class="btn primary" id="btnPhysical" disabled>⚔️ 物理</button>
            <button class="btn primary" id="btnMagic" disabled>🔮 法术</button>
            <button class="btn success" id="btnDefend" disabled>🛡️ 防御</button>
        </div>
        <div id="extraInfo" style="font-size:13px; margin-top:6px; color:#aaa;"></div>
    </div>

    <!-- 敌人面板（战斗中显示） -->
    <div class="panel" id="enemyPanel" style="display:none;">
        <div class="flex-between">
            <span style="font-weight:700; font-size:18px;" id="enemyName">👹 Boss</span>
            <span id="enemyHpText">❤️ 100/100</span>
        </div>
        <div class="bar-container">
            <div class="bar-fill hp" id="enemyHpBar" style="width:100%"></div>
            <span class="bar-label" id="enemyHpLabel">HP</span>
        </div>
        <div class="progress-container">
            <div class="bar-container">
                <div class="bar-fill progress" id="enemyProgressBar" style="width:0%"></div>
                <span class="bar-label" id="enemyProgressLabel">⏳ 0%</span>
            </div>
        </div>
        <div style="font-size:13px; color:#aaa; margin-top:4px;" id="enemyStatus"></div>
        <div class="stat-grid" id="enemyStatGrid" style="margin-top:8px;"></div>
    </div>

    <!-- 日志 -->
    <div class="log-box" id="logBox"></div>

    <!-- 动态区域（训练/剧情/结算） -->
    <div id="dynamicArea"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
